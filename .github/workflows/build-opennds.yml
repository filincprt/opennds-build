name: Build openNDS for OpenWrt 25.12.6

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "package/opennds/Makefile"
      - ".github/workflows/build-opennds.yml"

permissions:
  contents: read

concurrency:
  group: opennds-25.12.6-filogic
  cancel-in-progress: true

jobs:
  build:
    name: Build APK (mediatek/filogic)
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      OPENWRT_VERSION: "25.12.6"
      OPENNDS_VERSION: "11.0.0"
      OPENNDS_TAG_COMMIT: "9477b224bfd6d7f27ab1f1931afb61580b9470d1"
      SDK_SHA256: "1c04ac47bdfc3616d6aab299eb520d570e368013dedcb8d29cf39dc7168ae642e"
      SDK_FILE: "openwrt-sdk-25.12.6-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64.tar.zst"

    steps:
      - name: Check out build recipe
        uses: actions/checkout@v4

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip zlib1g-dev \
            file wget curl zstd

      - name: Download and verify the official OpenWrt SDK
        run: |
          set -euxo pipefail
          SDK_URL="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/mediatek/filogic/${SDK_FILE}"
          curl --fail --location --retry 3 --retry-all-errors \
            "$SDK_URL" -o "$RUNNER_TEMP/$SDK_FILE"
          ACTUAL_SDK_SHA256="$(sha256sum "$RUNNER_TEMP/$SDK_FILE" | awk '{print $1}')"
          echo "Expected SDK SHA-256: $SDK_SHA256"
          echo "Actual SDK SHA-256:   $ACTUAL_SDK_SHA256"
          test "$ACTUAL_SDK_SHA256" = "$SDK_SHA256"
          mkdir -p "$RUNNER_TEMP/openwrt-sdk"
          tar --zstd -xf "$RUNNER_TEMP/$SDK_FILE" -C "$RUNNER_TEMP/openwrt-sdk"
          SDK_DIR="$(find "$RUNNER_TEMP/openwrt-sdk" -mindepth 1 -maxdepth 1 -type d -name 'openwrt-sdk-*' -print -quit)"
          test -n "$SDK_DIR"
          echo "SDK_DIR=$SDK_DIR" >> "$GITHUB_ENV"
          echo "SDK archive SHA-256 verified: $SDK_SHA256"

      - name: Verify the official openNDS tag
        run: |
          set -euxo pipefail
          CHECK_DIR="$RUNNER_TEMP/opennds-tag-check"
          mkdir -p "$CHECK_DIR"
          git -C "$CHECK_DIR" init
          git -C "$CHECK_DIR" fetch --depth=1 \
            https://github.com/openNDS/openNDS.git \
            "refs/tags/v${OPENNDS_VERSION}"
          ACTUAL_COMMIT="$(git -C "$CHECK_DIR" rev-parse 'FETCH_HEAD^{commit}')"
          echo "Expected: $OPENNDS_TAG_COMMIT"
          echo "Actual:   $ACTUAL_COMMIT"
          test "$ACTUAL_COMMIT" = "$OPENNDS_TAG_COMMIT"

      - name: Update the pinned packages feed and install the build dependency
        run: |
          set -euxo pipefail
          cd "$SDK_DIR"
          ./scripts/feeds update packages
          ./scripts/feeds install -p packages libmicrohttpd
          test -f package/feeds/packages/libmicrohttpd/Makefile

      - name: Stage pinned openNDS source and package recipe
        run: |
          set -euxo pipefail
          cd "$SDK_DIR"
          mkdir -p dl package/opennds
          SOURCE_ARCHIVE="opennds-${OPENNDS_VERSION}.tar.gz"
          SOURCE_URL="https://codeload.github.com/openNDS/openNDS/tar.gz/v${OPENNDS_VERSION}"
          curl --fail --location --retry 3 --retry-all-errors \
            "$SOURCE_URL" -o "dl/$SOURCE_ARCHIVE"

          SOURCE_ROOT="$(tar -tzf "dl/$SOURCE_ARCHIVE" | head -n 1)"
          echo "Source archive root: $SOURCE_ROOT"
          case "$SOURCE_ROOT" in
            "openNDS-${OPENNDS_VERSION}/"*) ;;
            *) echo "Unexpected openNDS source archive layout"; exit 1 ;;
          esac

          echo "openNDS source archive SHA-256:"
          sha256sum "dl/$SOURCE_ARCHIVE"

          cp "$GITHUB_WORKSPACE/package/opennds/Makefile" package/opennds/Makefile

      - name: Configure SDK packages
        run: |
          set -euxo pipefail
          cd "$SDK_DIR"
          {
            echo "CONFIG_PACKAGE_libmicrohttpd-no-ssl=m"
            echo "CONFIG_PACKAGE_opennds=m"
          } >> .config
          make defconfig
          grep -E '^CONFIG_TARGET_ARCH_PACKAGES=|^CONFIG_PACKAGE_(libmicrohttpd-no-ssl|opennds)=' .config

      - name: Build libmicrohttpd (no SSL)
        run: |
          set -euxo pipefail
          cd "$SDK_DIR"
          make -j2 package/feeds/packages/libmicrohttpd/compile V=s

      - name: Build openNDS 11.0.0
        run: |
          set -euxo pipefail
          cd "$SDK_DIR"
          make -j2 package/opennds/compile V=s

      - name: Collect APK and checksums
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          mapfile -t PACKAGES < <(
            find "$SDK_DIR/bin/packages" -type f -name 'opennds*.apk' -print
          )
          if [ "${#PACKAGES[@]}" -ne 1 ]; then
            echo "Expected exactly one openNDS APK, found ${#PACKAGES[@]}"
            find "$SDK_DIR/bin/packages" -type f -name '*.apk' -print | sort
            exit 1
          fi

          cp "${PACKAGES[0]}" "$GITHUB_WORKSPACE/artifacts/"
          cp "$SDK_DIR/dl/opennds-${OPENNDS_VERSION}.tar.gz" \
            "$GITHUB_WORKSPACE/artifacts/"
          (
            cd "$GITHUB_WORKSPACE/artifacts"
            sha256sum *.apk *.tar.gz > SHA256SUMS
          )

          echo "## openNDS build succeeded" >> "$GITHUB_STEP_SUMMARY"
          echo "- OpenWrt: $OPENWRT_VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: mediatek/filogic" >> "$GITHUB_STEP_SUMMARY"
          echo "- Package architecture: aarch64_cortex-a53" >> "$GITHUB_STEP_SUMMARY"
          echo "- openNDS: $OPENNDS_VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact files:" >> "$GITHUB_STEP_SUMMARY"
          ls -lh "$GITHUB_WORKSPACE/artifacts" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: opennds-11.0.0-openwrt-25.12.6-mediatek-filogic
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
